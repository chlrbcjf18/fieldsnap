<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접근코드 해시 생성</title>
<style>body{font-family:system-ui,sans-serif;max-width:520px;margin:30px auto;padding:0 16px}input,button{font:inherit;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}code{display:block;word-break:break-all;background:#eee;padding:10px;border-radius:8px}</style>
<h2>접근코드 → 해시</h2><p>코드를 입력하고 나온 해시를 <b>www/access.js</b> 목록에 추가하세요. 삭제하면 그 코드는 즉시 사용 불가가 됩니다.</p>
<input id="c" placeholder="예: FS-A1B2C3"><button onclick="go()">해시 만들기</button><code id="o"></code>
<script>async function go(){const v=document.getElementById('c').value.trim();const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));document.getElementById('o').textContent='"'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')+'",';}</script>
</html>
